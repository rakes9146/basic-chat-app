# ===================================================================
# DOCKER COMPOSE - INSTANCE 4: APACHE KAFKA
# AWS Lightsail Instance: 2GB RAM
# Static IP: 3.147.109.193
# Service: Apache Kafka 3.7.0 (KRaft mode, no ZooKeeper)
# ===================================================================

version: '3.8'

services:
  # ===== KAFKA BROKER (KRaft Mode) =====
  kafka:
    image: apache/kafka:3.7.0
    container_name: chat-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"  # Internal listener (optional)
    environment:
      # KRaft Configuration (No ZooKeeper needed)
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      
      # Listeners Configuration
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://3.147.109.193:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      
      # Log Configuration
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      
      # Performance Tuning for 2GB Instance
      - KAFKA_NUM_NETWORK_THREADS=3
      - KAFKA_NUM_IO_THREADS=8
      - KAFKA_SOCKET_SEND_BUFFER_BYTES=102400
      - KAFKA_SOCKET_RECEIVE_BUFFER_BYTES=102400
      - KAFKA_SOCKET_REQUEST_MAX_BYTES=104857600
      
      # Replication Configuration (Single broker)
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      
      # Topic Auto-creation
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      
      # JVM Settings for 2GB instance
      - KAFKA_HEAP_OPTS=-Xmx1G -Xms512M
    volumes:
      # Persistent storage for Kafka logs and data
      - kafka-data:/var/lib/kafka/data
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  kafka-data:
    driver: local

networks:
  chat-network:
    driver: bridge

# ===================================================================
# DEPLOYMENT NOTES:
# ===================================================================
# 1. Start Kafka:
#    docker-compose up -d
#
# 2. Check logs:
#    docker-compose logs -f kafka
#
# 3. List topics:
#    docker-compose exec kafka kafka-topics --list --bootstrap-server localhost:9092
#
# 4. Create topic manually (optional, auto-created by app):
#    docker-compose exec kafka kafka-topics --create \
#      --topic chat.message.sent \
#      --partitions 3 \
#      --replication-factor 1 \
#      --bootstrap-server localhost:9092
#
# 5. Describe topic:
#    docker-compose exec kafka kafka-topics --describe \
#      --topic chat.message.sent \
#      --bootstrap-server localhost:9092
#
# 6. Test producer:
#    docker-compose exec kafka kafka-console-producer \
#      --topic test \
#      --bootstrap-server localhost:9092
#
# 7. Test consumer:
#    docker-compose exec kafka kafka-console-consumer \
#      --topic test \
#      --from-beginning \
#      --bootstrap-server localhost:9092
#
# ===================================================================
# FIREWALL CONFIGURATION (AWS Lightsail):
# ===================================================================
# Open port 9092 ONLY to these IPs:
# - 35.153.96.103 (User + Message Services instance)
#
# DO NOT open Kafka to public internet for security
#
# Custom Firewall Rule:
# Protocol: TCP
# Port: 9092
# Source: 35.153.96.103/32
#
# Port 9093 (Controller) should NOT be exposed publicly
#
# ===================================================================
# KAFKA TOPICS USED BY APPLICATION:
# ===================================================================
# These topics are auto-created by message-service:
# 1. chat.message.sent       - New messages published
# 2. chat.message.delivered  - Delivery confirmations
# 3. chat.message.read       - Read receipts
# 4. chat.user.presence      - User online/offline events
#
# Default partitions: 3
# Default replication: 1 (single broker)
#
# ===================================================================
# MONITORING:
# ===================================================================
# Check broker status:
#    docker-compose exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092
#
# Consumer group status:
#    docker-compose exec kafka kafka-consumer-groups \
#      --list \
#      --bootstrap-server localhost:9092
#
# Consumer group details:
#    docker-compose exec kafka kafka-consumer-groups \
#      --describe \
#      --group chat-group \
#      --bootstrap-server localhost:9092
#
# Check disk usage:
#    docker-compose exec kafka du -sh /var/lib/kafka/data
#
# ===================================================================
# DATA PERSISTENCE:
# ===================================================================
# Kafka data stored in volume: kafka-data
# Retention: 7 days (168 hours) by default
# Data survives container restarts
#
# To backup Kafka data:
#    docker run --rm -v kafka-data:/data -v $(pwd):/backup alpine tar czf /backup/kafka-backup.tar.gz /data
#
# ===================================================================
# TROUBLESHOOTING:
# ===================================================================
# Connection refused from Message Service:
# 1. Check firewall allows 35.153.96.103
# 2. Verify advertised listener: 3.147.109.193:9092
# 3. Test: telnet 3.147.109.193 9092
#
# Topics not created:
# 1. Check auto-create enabled: KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
# 2. Create manually using kafka-topics command above
#
# ===================================================================
# DNS MIGRATION (Future):
# ===================================================================
# After setting up DNS:
# - Register A record: kafka.yourdomain.com -> 3.147.109.193
# - Update KAFKA_ADVERTISED_LISTENERS: kafka.yourdomain.com:9092
# - Update all services: SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka.yourdomain.com:9092
# ===================================================================
