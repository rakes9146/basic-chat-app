version: '3.8'

services:
  # ===== INFRASTRUCTURE =====
  mysql:
    image: mysql:8.0
    container_name: chat-mysql-local
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass123
      - MYSQL_DATABASE=chatdb
      - MYSQL_USER=chatuser
      - MYSQL_PASSWORD=chatpass123
    volumes:
      - mysql-data-local:/var/lib/mysql
    networks:
      - chat-network-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: chat-kafka-local
    ports:
      - "9092:9092"
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka-data-local:/var/lib/kafka/data
    networks:
      - chat-network-local
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: chat-redis-local
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-local:/data
    networks:
      - chat-network-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== SERVICE DISCOVERY =====
  eureka:
    image: rakes9146/chat-eureka:distributed
    container_name: chat-eureka-local
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC
    networks:
      - chat-network-local
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== API GATEWAY =====
  gateway:
    image: rakes9146/chat-api-gateway:distributed
    container_name: chat-gateway-local
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80
      - JAVA_OPTS=-Xmx256m -Xms128m -XX:+UseG1GC
    networks:
      - chat-network-local
    depends_on:
      eureka:
        condition: service_healthy

  # ===== USER SERVICE =====
  user-service:
    image: rakes9146/chat-user-service:distributed
    container_name: chat-user-service-local
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/chatdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=chatuser
      - SPRING_DATASOURCE_PASSWORD=chatpass123
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC
    command: ["java", "-Dserver.port=8081", "-Deureka.instance.preferIpAddress=true", "-jar", "/app/app.jar"]
    networks:
      - chat-network-local
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy

  # ===== MESSAGE SERVICE =====
  message-service:
    image: rakes9146/chat-message-service:distributed
    container_name: chat-message-service-local
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - EUREKA_INSTANCE_HOSTNAME=message-service
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/chatdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=chatuser
      - SPRING_DATASOURCE_PASSWORD=chatpass123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - WEBSOCKET_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:80
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC
    networks:
      - chat-network-local
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka:
        condition: service_healthy

  # ===== FRONTEND =====
  # For local testing: Run frontend separately with "ng serve"
  # Frontend will connect directly to:
  #   - API Gateway: http://localhost:8082
  #   - WebSocket: ws://localhost:8083/ws
  # No Docker container needed for local development!

volumes:
  mysql-data-local:
  kafka-data-local:
  redis-data-local:

networks:
  chat-network-local:
    driver: bridge
