# ===================================================================
# DOCKER COMPOSE - INSTANCE 6: ANGULAR FRONTEND
# AWS Lightsail Instance: 1GB RAM
# Static IP: 54.154.129.84
# Service: Nginx serving Angular production build
# ===================================================================

version: '3.8'

services:
  # ===== FRONTEND (NGINX) =====
  frontend:
    image: rakes9146/chat-frontend:distributed
    container_name: chat-frontend
    hostname: frontend
    ports:
      - "80:80"
      - "443:443"  # For future HTTPS setup
    environment:
      # API Gateway URL (used by Angular environment)
      - API_GATEWAY_URL=http://54.217.247.163:8082
      
      # WebSocket URL (Message Service)
      - WEBSOCKET_URL=ws://35.153.96.103:8083/ws
    volumes:
      # AWS-specific nginx configuration with actual IP addresses
      - ./nginx-aws.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  chat-network:
    driver: bridge

# ===================================================================
# DEPLOYMENT NOTES:
# ===================================================================
# 1. Build Angular production app first:
#    cd ../../frontend
#    npm install
#    npm run build --configuration production
#
# 2. Build Docker image:
#    docker-compose build
#
# 3. Push to Docker Hub (optional):
#    docker-compose push
#
# 4. Start frontend:
#    docker-compose up -d
#
# 5. Check logs:
#    docker-compose logs -f frontend
#
# 6. Access application:
#    http://54.154.129.84
#
# ===================================================================
# FIREWALL CONFIGURATION (AWS Lightsail):
# ===================================================================
# Open these ports:
# - 80 (HTTP - Required, public access)
# - 443 (HTTPS - Required after SSL setup)
#
# Allow from: 0.0.0.0/0 (public internet)
