spring.application.name=api-gateway
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8123/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG

## Simple CORS for development - allow Angular origin
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# Simple routes - let discovery locator handle most routing
spring.cloud.gateway.routes[0].id=message-service
spring.cloud.gateway.routes[0].uri=lb://MESSAGE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/MESSAGE-SERVICE/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/MESSAGE-SERVICE/(?<segment>.*),/$\{segment}

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/USER-SERVICE/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/USER-SERVICE/(?<segment>.*),/$\{segment}
