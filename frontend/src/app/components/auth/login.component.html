<div class="login-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-lg">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">
            <i class="fas fa-comments me-2"></i> Chat Application
          </h2>
          <p class="text-center text-muted mb-4">Sign in to your account</p>

          <div *ngIf="error" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="userName" class="form-label">Username</label>
              <input
                type="text"
                formControlName="userName"
                class="form-control"
                id="userName"
                placeholder="Enter your username"
                [class.is-invalid]="submitted && f['userName'].errors"
              />
              <div class="invalid-feedback" *ngIf="submitted && f['userName'].errors">
                Username is required
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                formControlName="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                [class.is-invalid]="submitted && f['password'].errors"
              />
              <div class="invalid-feedback" *ngIf="submitted && f['password'].errors">
                Password is required
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              <span *ngIf="!loading">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
              </span>
              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
              </span>
            </button>
          </form>

          <hr class="my-4" />

          <p class="text-center">
            Don't have an account? <a routerLink="/register" class="text-primary fw-bold">Register now</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
